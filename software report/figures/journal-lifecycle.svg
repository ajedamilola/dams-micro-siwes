<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" role="img" aria-labelledby="title desc">
  <title id="title">Journal transaction lifecycle</title>
  <desc id="desc">A draft transaction is submitted after passing the balance check, then posted. Drafts may be deleted, submitted journals cancelled, and posted journals corrected with a linked reversal.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1a1a1a"/>
    </marker>
    <marker id="arrowMuted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#6b6b6b"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="900" height="400" fill="#ffffff"/>

  <rect x="32" y="62" width="168" height="78" rx="4" fill="#f2f2f2" stroke="#1a1a1a" stroke-width="1.6"/>
  <text x="116" y="96" font-family="'IBM Plex Sans', Helvetica, Arial, sans-serif" font-size="16" font-weight="600" text-anchor="middle" fill="#1a1a1a">Draft</text>
  <text x="116" y="119" font-family="'IBM Plex Sans', Helvetica, Arial, sans-serif" font-size="12" text-anchor="middle" fill="#4a4a4a">entries added</text>

  <line x1="200" y1="101" x2="274" y2="101" stroke="#1a1a1a" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="237" y="86" font-family="'IBM Plex Sans', Helvetica, Arial, sans-serif" font-size="12" text-anchor="middle" fill="#4a4a4a">submit</text>

  <rect x="278" y="62" width="184" height="78" rx="4" fill="#f2f2f2" stroke="#1a1a1a" stroke-width="1.6"/>
  <text x="370" y="96" font-family="'IBM Plex Sans', Helvetica, Arial, sans-serif" font-size="16" font-weight="600" text-anchor="middle" fill="#1a1a1a">Submitted</text>
  <text x="370" y="119" font-family="'IBM Plex Sans', Helvetica, Arial, sans-serif" font-size="12" text-anchor="middle" fill="#4a4a4a">awaiting posting</text>

  <line x1="462" y1="101" x2="546" y2="101" stroke="#1a1a1a" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="504" y="86" font-family="'IBM Plex Sans', Helvetica, Arial, sans-serif" font-size="12" text-anchor="middle" fill="#4a4a4a">post</text>

  <rect x="550" y="62" width="168" height="78" rx="4" fill="#e4e4e4" stroke="#1a1a1a" stroke-width="1.6"/>
  <text x="634" y="96" font-family="'IBM Plex Sans', Helvetica, Arial, sans-serif" font-size="16" font-weight="600" text-anchor="middle" fill="#1a1a1a">Posted</text>
  <text x="634" y="119" font-family="'IBM Plex Sans', Helvetica, Arial, sans-serif" font-size="12" text-anchor="middle" fill="#4a4a4a">balances updated</text>

  <rect x="728" y="58" width="150" height="86" rx="4" fill="#ffffff" stroke="#6b6b6b" stroke-width="1.3" stroke-dasharray="4 3"/>
  <text x="803" y="84" font-family="'IBM Plex Sans', Helvetica, Arial, sans-serif" font-size="12" font-weight="600" text-anchor="middle" fill="#1a1a1a">Submission check</text>
  <text x="803" y="105" font-family="'IBM Plex Sans', Helvetica, Arial, sans-serif" font-size="11" text-anchor="middle" fill="#4a4a4a">2 or more entries</text>
  <text x="803" y="123" font-family="'IBM Plex Sans', Helvetica, Arial, sans-serif" font-size="11" text-anchor="middle" fill="#4a4a4a">debits = credits</text>

  <line x1="277" y1="140" x2="277" y2="238" stroke="#6b6b6b" stroke-width="1.3" stroke-dasharray="4 3" marker-end="url(#arrowMuted)"/>
  <text x="266" y="186" font-family="'IBM Plex Sans', Helvetica, Arial, sans-serif" font-size="12" text-anchor="end" fill="#4a4a4a">cancel</text>

  <rect x="198" y="242" width="158" height="66" rx="4" fill="#ffffff" stroke="#6b6b6b" stroke-width="1.3"/>
  <text x="277" y="281" font-family="'IBM Plex Sans', Helvetica, Arial, sans-serif" font-size="14" text-anchor="middle" fill="#1a1a1a">Cancelled</text>

  <line x1="116" y1="140" x2="116" y2="238" stroke="#6b6b6b" stroke-width="1.3" stroke-dasharray="4 3" marker-end="url(#arrowMuted)"/>
  <text x="106" y="186" font-family="'IBM Plex Sans', Helvetica, Arial, sans-serif" font-size="12" text-anchor="end" fill="#4a4a4a">delete</text>

  <rect x="32" y="242" width="148" height="66" rx="4" fill="#ffffff" stroke="#6b6b6b" stroke-width="1.3"/>
  <text x="106" y="281" font-family="'IBM Plex Sans', Helvetica, Arial, sans-serif" font-size="14" text-anchor="middle" fill="#1a1a1a">Deleted</text>

  <line x1="634" y1="140" x2="634" y2="238" stroke="#1a1a1a" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="646" y="192" font-family="'IBM Plex Sans', Helvetica, Arial, sans-serif" font-size="12" fill="#4a4a4a">reverse, with a reason</text>

  <rect x="550" y="242" width="168" height="66" rx="4" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.6"/>
  <text x="634" y="270" font-family="'IBM Plex Sans', Helvetica, Arial, sans-serif" font-size="14" font-weight="600" text-anchor="middle" fill="#1a1a1a">Reversal journal</text>
  <text x="634" y="291" font-family="'IBM Plex Sans', Helvetica, Arial, sans-serif" font-size="11" text-anchor="middle" fill="#4a4a4a">linked to the original</text>

  <text x="450" y="370" font-family="'IBM Plex Sans', Helvetica, Arial, sans-serif" font-size="13" text-anchor="middle" fill="#4a4a4a">Posted entries are not edited in place; corrections are recorded as linked reversals.</text>
</svg>
