<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 480" role="img" aria-labelledby="title desc">
  <title id="title">Migration and seeding flow</title>
  <desc id="desc">Migration files are applied with php artisan migrate to create the PostgreSQL schema. Seeders then populate demo rows through php artisan db:seed. Queries, EXPLAIN and DBeaver use the resulting schema and data.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1a1a1a"/>
    </marker>
  </defs>
  <rect width="900" height="480" fill="#ffffff"/>
  <g font-family="'IBM Plex Sans', Helvetica, Arial, sans-serif" font-size="12" fill="#1a1a1a">

    <rect x="40" y="40" width="230" height="80" rx="4" fill="#f2f2f2" stroke="#1a1a1a" stroke-width="1.4"/>
    <text x="155" y="72" font-size="14" font-weight="600" text-anchor="middle">Migration files</text>
    <text x="155" y="94" text-anchor="middle" fill="#5a5a5a">Schema::create and constraints</text>

    <rect x="40" y="160" width="230" height="70" rx="4" fill="#f2f2f2" stroke="#1a1a1a" stroke-width="1.4"/>
    <text x="155" y="190" font-family="'IBM Plex Mono', Courier, monospace" font-size="11" text-anchor="middle">php artisan migrate</text>
    <text x="155" y="210" text-anchor="middle" fill="#5a5a5a">versioned schema changes</text>

    <rect x="40" y="270" width="230" height="90" rx="4" fill="#e5e5e5" stroke="#1a1a1a" stroke-width="1.4"/>
    <text x="155" y="302" font-size="14" font-weight="600" text-anchor="middle">PostgreSQL schema</text>
    <text x="155" y="324" text-anchor="middle" fill="#5a5a5a">tables, keys, indexes</text>
    <text x="155" y="342" text-anchor="middle" fill="#5a5a5a">20 migration files applied</text>

    <rect x="520" y="40" width="230" height="80" rx="4" fill="#f2f2f2" stroke="#1a1a1a" stroke-width="1.4"/>
    <text x="635" y="72" font-size="14" font-weight="600" text-anchor="middle">Seeders and factories</text>
    <text x="635" y="94" text-anchor="middle" fill="#5a5a5a">demo companies, loans, journals</text>

    <rect x="520" y="160" width="230" height="70" rx="4" fill="#f2f2f2" stroke="#1a1a1a" stroke-width="1.4"/>
    <text x="635" y="190" font-family="'IBM Plex Mono', Courier, monospace" font-size="11" text-anchor="middle">php artisan db:seed</text>
    <text x="635" y="210" text-anchor="middle" fill="#5a5a5a">runs the seeder classes</text>

    <rect x="520" y="270" width="230" height="90" rx="4" fill="#e5e5e5" stroke="#1a1a1a" stroke-width="1.4"/>
    <text x="635" y="302" font-size="14" font-weight="600" text-anchor="middle">Demo rows</text>
    <text x="635" y="324" text-anchor="middle" fill="#5a5a5a">84 accounts, 21 journals</text>
    <text x="635" y="342" text-anchor="middle" fill="#5a5a5a">9 loans, 61 schedules</text>

    <rect x="300" y="395" width="300" height="60" rx="4" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.4"/>
    <text x="450" y="421" font-size="14" font-weight="600" text-anchor="middle">Queries, EXPLAIN and DBeaver</text>
    <text x="450" y="442" text-anchor="middle" fill="#5a5a5a">results used in this report</text>

    <line x1="155" y1="120" x2="155" y2="152" stroke="#1a1a1a" stroke-width="1.4" marker-end="url(#arrow)"/>
    <line x1="155" y1="230" x2="155" y2="262" stroke="#1a1a1a" stroke-width="1.4" marker-end="url(#arrow)"/>
    <line x1="635" y1="120" x2="635" y2="152" stroke="#1a1a1a" stroke-width="1.4" marker-end="url(#arrow)"/>
    <line x1="635" y1="230" x2="635" y2="262" stroke="#1a1a1a" stroke-width="1.4" marker-end="url(#arrow)"/>

    <path d="M270 315 H400 V80 H512" fill="none" stroke="#1a1a1a" stroke-width="1.4" marker-end="url(#arrow)"/>
    <text x="340" y="305" font-size="10" fill="#5a5a5a">schema must exist first</text>

    <path d="M635 360 V395" fill="none" stroke="#1a1a1a" stroke-width="1.4" marker-end="url(#arrow)"/>
    <text x="450" y="380" font-size="10" fill="#5a5a5a" text-anchor="middle">query the populated database</text>

    <text x="450" y="472" font-size="10" text-anchor="middle" fill="#5a5a5a">Tests use an in-memory SQLite database, so PostgreSQL-specific verification is done separately.</text>
  </g>
</svg>
