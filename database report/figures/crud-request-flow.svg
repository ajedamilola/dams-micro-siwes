<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 460" role="img" aria-labelledby="title desc">
  <title id="title">CRUD request flow through Laravel and PostgreSQL</title>
  <desc id="desc">A browser form sends a request to a route and controller. Validation either rejects it or passes it to the DB facade, which executes bound SQL against PostgreSQL and returns a redirect or Inertia response.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1a1a1a"/>
    </marker>
    <marker id="arrowMuted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#6a6a6a"/>
    </marker>
  </defs>
  <rect width="900" height="460" fill="#ffffff"/>
  <g font-family="'IBM Plex Sans', Helvetica, Arial, sans-serif" font-size="12" fill="#1a1a1a">

    <rect x="20" y="150" width="150" height="90" rx="4" fill="#f2f2f2" stroke="#1a1a1a" stroke-width="1.4"/>
    <text x="95" y="186" font-size="14" font-weight="600" text-anchor="middle">Browser form</text>
    <text x="95" y="208" text-anchor="middle" fill="#5a5a5a">Inertia visit</text>

    <rect x="210" y="150" width="170" height="90" rx="4" fill="#f2f2f2" stroke="#1a1a1a" stroke-width="1.4"/>
    <text x="295" y="186" font-size="14" font-weight="600" text-anchor="middle">Route + controller</text>
    <text x="295" y="208" text-anchor="middle" fill="#5a5a5a">authorisation and input</text>

    <rect x="420" y="150" width="150" height="90" rx="4" fill="#f2f2f2" stroke="#1a1a1a" stroke-width="1.4"/>
    <text x="495" y="186" font-size="14" font-weight="600" text-anchor="middle">Validation</text>
    <text x="495" y="208" text-anchor="middle" fill="#5a5a5a">types, rules, limits</text>

    <rect x="610" y="130" width="230" height="120" rx="4" fill="#f2f2f2" stroke="#1a1a1a" stroke-width="1.4"/>
    <text x="725" y="162" font-size="14" font-weight="600" text-anchor="middle">DB facade</text>
    <text x="725" y="186" font-family="'IBM Plex Mono', Courier, monospace" font-size="11" text-anchor="middle">DB::select / insert</text>
    <text x="725" y="204" font-family="'IBM Plex Mono', Courier, monospace" font-size="11" text-anchor="middle">update / delete</text>
    <text x="725" y="228" text-anchor="middle" fill="#5a5a5a">values sent as bindings</text>

    <rect x="610" y="300" width="230" height="80" rx="4" fill="#e5e5e5" stroke="#1a1a1a" stroke-width="1.4"/>
    <text x="725" y="333" font-size="14" font-weight="600" text-anchor="middle">PostgreSQL</text>
    <text x="725" y="355" text-anchor="middle" fill="#5a5a5a">tables, keys, indexes</text>

    <rect x="330" y="310" width="190" height="80" rx="4" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.4"/>
    <text x="425" y="343" font-size="14" font-weight="600" text-anchor="middle">Response</text>
    <text x="425" y="365" text-anchor="middle" fill="#5a5a5a">redirect or Inertia props</text>

    <rect x="420" y="35" width="150" height="70" rx="4" fill="#ffffff" stroke="#6a6a6a" stroke-width="1.2" stroke-dasharray="4 3"/>
    <text x="495" y="62" font-size="12" font-weight="600" text-anchor="middle">Invalid input</text>
    <text x="495" y="82" text-anchor="middle" fill="#5a5a5a">422 or redirect back</text>

    <line x1="170" y1="195" x2="202" y2="195" stroke="#1a1a1a" stroke-width="1.4" marker-end="url(#arrow)"/>
    <line x1="380" y1="195" x2="412" y2="195" stroke="#1a1a1a" stroke-width="1.4" marker-end="url(#arrow)"/>
    <line x1="570" y1="195" x2="602" y2="195" stroke="#1a1a1a" stroke-width="1.4" marker-end="url(#arrow)"/>
    <text x="586" y="187" font-size="10" fill="#5a5a5a" text-anchor="middle">valid</text>

    <line x1="725" y1="250" x2="725" y2="292" stroke="#1a1a1a" stroke-width="1.4" marker-end="url(#arrow)"/>
    <text x="737" y="275" font-size="10" fill="#5a5a5a">SQL</text>

    <line x1="610" y1="340" x2="528" y2="340" stroke="#1a1a1a" stroke-width="1.4" marker-end="url(#arrow)"/>
    <text x="569" y="332" font-size="10" fill="#5a5a5a" text-anchor="middle">rows</text>

    <path d="M330 350 H250 V240 H178" fill="none" stroke="#1a1a1a" stroke-width="1.4" marker-end="url(#arrow)"/>
    <text x="258" y="300" font-size="10" fill="#5a5a5a" text-anchor="middle">redirect or props</text>

    <line x1="495" y1="150" x2="495" y2="113" stroke="#6a6a6a" stroke-width="1.2" stroke-dasharray="4 3" marker-end="url(#arrowMuted)"/>
    <text x="505" y="132" font-size="10" fill="#5a5a5a">invalid</text>

    <text x="450" y="440" font-size="11" text-anchor="middle" fill="#5a5a5a">The same path carries SELECT, INSERT, UPDATE and DELETE operations.</text>
  </g>
</svg>
